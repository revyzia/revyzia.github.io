<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revyzia, chapitre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --accent:#0E7490; --accent-clair:#7FD3E0; --accent-sombre:#0A5568;
    --encre:#0C181C; --encre-doux:#4E6166;
    --papier:#E8F1F3;
    --verre:rgba(255,255,255,.52); --verre-bord:rgba(255,255,255,.75); --verre-haut:rgba(255,255,255,.95);
    --ombre:0 18px 44px rgba(8,38,48,.14);
    --teinte:rgba(14,116,144,.12);
    --vert:#0F7F4F; --vert-fond:rgba(15,127,79,.14);
    --rouge:#B3261E; --rouge-fond:rgba(179,38,30,.14);
    --ambre:#8A5A00; --ambre-fond:rgba(138,90,0,.14);
    --fond:
      radial-gradient(760px 560px at 8% 2%, #9FE0EA 0%, rgba(159,224,234,0) 62%),
      radial-gradient(680px 620px at 96% 14%, #CDEADF 0%, rgba(205,234,223,0) 60%),
      radial-gradient(820px 600px at 70% 100%, #6FBED4 0%, rgba(111,190,212,0) 64%),
      linear-gradient(165deg, #F2F9FA 0%, #DCEBEF 100%);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --encre:#EEF6F7; --encre-doux:#93AAB0; --papier:#05141A;
      --verre:rgba(255,255,255,.10); --verre-bord:rgba(255,255,255,.26); --verre-haut:rgba(255,255,255,.55);
      --ombre:0 18px 44px rgba(0,0,0,.45);
      --teinte:rgba(127,211,224,.16);
      --vert:#5FD0A0; --vert-fond:rgba(95,208,160,.16);
      --rouge:#FF8C84; --rouge-fond:rgba(255,140,132,.16);
      --ambre:#E8BC6A; --ambre-fond:rgba(232,188,106,.16);
      --fond:
        radial-gradient(760px 560px at 8% 2%, #0E7490 0%, rgba(14,116,144,0) 62%),
        radial-gradient(680px 620px at 96% 14%, #13505E 0%, rgba(19,80,94,0) 60%),
        radial-gradient(820px 600px at 70% 100%, #0B6B7A 0%, rgba(11,107,122,0) 64%),
        linear-gradient(165deg, #041217 0%, #072027 100%);
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--papier); color:var(--encre);
         padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
         font-family:"Instrument Sans",system-ui,-apple-system,sans-serif; line-height:1.55; }
  .fond { position:fixed; inset:0; z-index:-1; background:var(--fond); }
  h1,h2,.val,.marque { font-family:"Bricolage Grotesque","Instrument Sans",sans-serif; }
  main { max-width:780px; margin:0 auto; padding:22px 20px 80px; }

  .carte, .pastille, .retour, .onglet, .reponse, .btn.sobre {
    background:var(--verre); border:1px solid var(--verre-bord);
    box-shadow:var(--ombre), inset 0 1.5px 0 var(--verre-haut);
    backdrop-filter:blur(22px) saturate(1.7); -webkit-backdrop-filter:blur(22px) saturate(1.7);
  }
  .carte { backdrop-filter:url(#rvzLens) blur(3px) saturate(1.7); }
  .reponse { backdrop-filter:blur(10px) saturate(1.3); background:rgba(255,255,255,.26);
             box-shadow:inset 0 1px 0 rgba(255,255,255,.5); }
  @media (prefers-color-scheme: dark) {
    .reponse { background:rgba(255,255,255,.06); box-shadow:inset 0 1px 0 rgba(255,255,255,.14); }
  }
  .pastille, .retour, .onglet, .btn.sobre { box-shadow:inset 0 1.5px 0 var(--verre-haut); }

  .barre-haut { position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
                display:flex; align-items:center; justify-content:space-between; gap:14px;
                margin:0 0 26px; padding:10px 12px; border-radius:20px;
                background:var(--verre); border:1px solid var(--verre-bord);
                box-shadow:var(--ombre), inset 0 1.5px 0 var(--verre-haut);
                backdrop-filter:blur(22px) saturate(1.7); -webkit-backdrop-filter:blur(22px) saturate(1.7); }
  .barre-gauche { display:flex; align-items:center; gap:11px; min-width:0; }
  .barre-droite { display:flex; gap:8px; flex-shrink:0; }
  .barre-titre { font-size:15px; font-weight:600; white-space:nowrap;
                 overflow:hidden; text-overflow:ellipsis; }
  .rond { display:flex; align-items:center; justify-content:center; width:36px; height:36px;
          border-radius:12px; color:var(--encre); text-decoration:none;
          background:rgba(127,211,224,.14); border:1px solid var(--verre-bord); flex-shrink:0; }
  .rond:hover { background:var(--teinte); }
  .pastille { border-radius:12px; padding:8px 12px; font-size:13px; font-weight:700;
              background:rgba(127,211,224,.14); border:1px solid var(--verre-bord); }
  .pastille.accent { background:var(--accent); border-color:transparent; color:#fff; }

  .titre-chapitre { margin:0 0 8px; font-size:34px; font-weight:800; letter-spacing:-1px; line-height:1.08; }
  .sous-titre { margin:0 0 12px; color:var(--encre-doux); font-size:15.5px; }
  .badges { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:26px; }
  .badge { font-size:12px; font-weight:700; letter-spacing:.3px; text-transform:uppercase;
           padding:6px 11px; border-radius:9px; background:var(--teinte); color:var(--accent); }
  @media (prefers-color-scheme: dark) { .badge { color:var(--accent-clair); } }
  .badge.auto { background:var(--ambre-fond); color:var(--ambre); display:inline-flex; align-items:center; gap:6px; }

  .onglets { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:12px; }
  .onglet { border-radius:13px; padding:10px 15px; color:var(--encre);
            font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; }
  .onglet.actif { background:var(--accent); border-color:transparent; color:#fff;
                  box-shadow:0 8px 20px rgba(14,116,144,.3); }
  .modes { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:24px; }
  .mode { border:1px solid transparent; background:transparent; color:var(--encre-doux);
          border-radius:11px; padding:8px 13px; font-family:inherit; font-size:13.5px; font-weight:600; cursor:pointer; }
  .mode.actif { color:var(--accent); border-color:var(--verre-bord); background:var(--teinte); }
  @media (prefers-color-scheme: dark) { .mode.actif { color:var(--accent-clair); } }
  .mode:disabled { opacity:.35; cursor:not-allowed; }

  .carte { border-radius:24px; padding:24px; }
  .bloc { margin-bottom:14px; }
  .bloc p { margin:0; }
  .bloc-titre { font-weight:700; margin-bottom:6px; }
  .def { background:var(--teinte); border-left:3px solid var(--accent); border-radius:14px; padding:16px 18px; }
  .exemple { background:var(--vert-fond); border-left:3px solid var(--vert); border-radius:14px; padding:16px 18px; }
  .piege { background:var(--ambre-fond); border-left:3px solid var(--ambre); border-radius:14px; padding:16px 18px; }
  .formule { text-align:center; font-size:18px; font-weight:600; padding:16px;
             border:1px dashed var(--verre-bord); border-radius:14px; }

  .flash { min-height:210px; display:flex; flex-direction:column; align-items:center; justify-content:center;
           text-align:center; gap:16px; cursor:pointer; }
  .flash-recto { font-size:20px; font-weight:600; }
  .flash-verso { font-size:16.5px; color:var(--encre-doux); }
  .flash-indice { font-size:12.5px; color:var(--encre-doux); }

  .question { font-size:19px; font-weight:700; margin-bottom:18px; }
  .reponses { display:flex; flex-direction:column; gap:10px; }
  .reponse { text-align:left; color:var(--encre); border-radius:15px; padding:14px 16px;
             font-family:inherit; font-size:15px; cursor:pointer; transition:transform .12s ease; }
  .reponse:hover:not(:disabled) { border-color:var(--accent); transform:translateX(2px); }
  .reponse.juste { background:var(--vert-fond); border-color:var(--vert); font-weight:600; }
  .reponse.faux { background:var(--rouge-fond); border-color:var(--rouge); }
  .reponse:disabled { cursor:default; transform:none; }
  .explication { margin-top:16px; padding:14px 16px; border-radius:14px; background:var(--teinte); font-size:14.5px; }

  .exo-enonce { font-size:16px; margin-bottom:16px; }
  .correction { margin-top:14px; padding:15px 17px; border-radius:14px; background:var(--vert-fond);
                font-size:15px; display:none; }
  .correction.visible { display:block; }

  .pied { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:18px; }
  .progression { font-size:13px; color:var(--encre-doux); }
  .btn { border:none; border-radius:14px; background:var(--accent); color:#fff;
         padding:12px 19px; font-family:inherit; font-size:15px; font-weight:600; cursor:pointer;
         box-shadow:0 10px 22px rgba(14,116,144,.28); transition:transform .12s ease; }
  .btn:hover { background:var(--accent-sombre); transform:translateY(-1px); }
  .btn.sobre { background:var(--verre); color:var(--encre); box-shadow:inset 0 1.5px 0 var(--verre-haut); }
  .btn.sobre:hover { background:var(--teinte); }
  .btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }
  .info { color:var(--encre-doux); font-size:14.5px; }
  .signal { margin-top:14px; background:none; border:none; color:var(--encre-doux);
            font-family:inherit; font-size:13px; text-decoration:underline; cursor:pointer; padding:0; }
</style>
</head>

  <h1 class="titre-chapitre" id="titre">Chargement...</h1>
  <p class="sous-titre" id="sousTitre"></p>
  <div class="badges" id="badges"></div>

  <div class="onglets" id="onglets"></div>
  <div class="modes" id="modes"></div>

  <div id="contenu"></div>
</main>

<script>
(function () {
  "use strict";

  var VERSION = "11.3.1";
  var BASES = [
    "https://cdn.jsdelivr.net/npm/firebase@" + VERSION + "/",
    "https://unpkg.com/firebase@" + VERSION + "/",
    "https://www.gstatic.com/firebasejs/" + VERSION + "/"
  ];
  var FICHIERS = ["firebase-app-compat.js", "firebase-auth-compat.js", "firebase-firestore-compat.js"];
  var CONFIG = {
    apiKey: "AIzaSyDRUVa_1o3Mbz6Gyn8SuQlbjYyV5RNVKGY",
    authDomain: "revyzia-app.firebaseapp.com",
    projectId: "revyzia-app",
    storageBucket: "revyzia-app.firebasestorage.app",
    messagingSenderId: "841690966708",
    appId: "1:841690966708:web:412fd2b2a48686dc9785e1"
  };
  var XP_PAR_MODE = { cours: 3, flashcards: 5, qcm: 10, exercices: 8 };
  var NOMS_MODES = { cours: "Cours", flashcards: "Flashcards", qcm: "QCM", exercices: "Exos" };

  var $ = function (id) { return document.getElementById(id); };

  var chapitre = null, sectionActive = 0, modeActif = "cours", index = 0;
  var faits = {};          // cle d'item -> true
  var auth = null, db = null, utilisateur = null, refProgression = null;
  var verso = false, repondu = false, correctionVisible = false;

  // ---------- chargement du SDK, jsdelivr d'abord
  function charger(url) {
    return new Promise(function (ok, ko) {
      var s = document.createElement("script");
      s.src = url; s.async = false;
      s.onload = function () { ok(); };
      s.onerror = function () { ko(new Error(url)); };
      document.head.appendChild(s);
    });
  }
  function avecSecours(fichier) {
    var i = 0;
    function suivant() {
      if (i >= BASES.length) return Promise.reject(new Error("aucune source pour " + fichier));
      var url = BASES[i++] + fichier;
      return charger(url).catch(function () {
        console.warn("[Revyzia] indisponible :", url);
        return suivant();
      });
    }
    return suivant();
  }
  function chargerSdk() {
    return FICHIERS.reduce(function (c, f) { return c.then(function () { return avecSecours(f); }); }, Promise.resolve());
  }

  // ---------- demarrage
  var id = new URLSearchParams(location.search).get("c");
  if (!id) { $("titre").textContent = "Aucun chapitre demandé"; return; }

  // 1. un fichier du depot, 2. sinon un chapitre publie dans Firestore
  chargerSdk().then(function () {
    firebase.initializeApp(CONFIG);
    auth = firebase.auth();
    db = firebase.firestore();
    try { db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); } catch (e) {}
    return fetch("cours/" + id + ".json").then(function (r) {
      if (r.ok) return r.json();
      return null;
    }).catch(function () { return null; });
  })
    .then(function (fichier) {
      if (fichier) { chapitre = fichier; afficherEntete(); return; }
      return new Promise(function (ok, ko) {
        auth.onAuthStateChanged(function (u) {
          if (!u) { ko(new Error("connecte-toi pour voir ce chapitre")); return; }
          db.collection("chapitres").doc(id).get().then(function (d) {
            if (!d.exists) { ko(new Error("chapitre introuvable")); return; }
            chapitre = d.data();
            afficherEntete();
            ok();
          }).catch(ko);
        });
      });
    })
    .then(function () {
      auth.onAuthStateChanged(function (u) {
        utilisateur = u;
        if (!u) { construire(); return; }
        refProgression = db.collection("users").doc(u.uid).collection("progression").doc(chapitre.id);
        refProgression.get().then(function (d) {
          if (d.exists && d.data().itemsFaits) faits = d.data().itemsFaits;
          construire();
        }).catch(function (e) {
          console.error("[Revyzia] progression illisible", e);
          construire();
        });
      });
    })
    .catch(function (e) {
      console.error("[Revyzia] echec", e);
      $("titre").textContent = "Chapitre introuvable";
      $("sousTitre").textContent = e.message;
    });

  function afficherEntete() {
    document.title = "Revyzia, " + chapitre.titre;
    $("titre").textContent = chapitre.titre;
    var bt = $("barreTitre");
    if (bt) bt.textContent = chapitre.matiereNom || chapitre.matiere || "Chapitre";
    $("sousTitre").textContent = chapitre.sousTitre || "";
    var b = $("badges");
    b.innerHTML = "";
    ajouterBadge(b, chapitre.matiereNom || chapitre.matiere, "badge");
    if (chapitre.niveau) ajouterBadge(b, chapitre.niveau, "badge");
    if (chapitre.statut === "genere") {
      var e = document.createElement("span");
      e.className = "badge auto";
      e.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 5.4L19 9l-5.2 1.6L12 16l-1.8-5.4L5 9l5.2-1.6z"/></svg> Généré automatiquement';
      b.appendChild(e);
    }
  }
  function ajouterBadge(parent, texte, classe) {
    var s = document.createElement("span");
    s.className = classe; s.textContent = texte;
    parent.appendChild(s);
  }

  // ---------- navigation
  function construire() {
    var o = $("onglets");
    o.innerHTML = "";
    chapitre.sections.forEach(function (s, i) {
      var b = document.createElement("button");
      b.className = "onglet" + (i === sectionActive ? " actif" : "");
      b.textContent = s.titre;
      b.addEventListener("click", function () {
        sectionActive = i; index = 0; reinitialiser(); construire();
      });
      o.appendChild(b);
    });
    construireModes();
    rendre();
    majCompteurs();
  }

  function construireModes() {
    var m = $("modes");
    m.innerHTML = "";
    ["cours", "flashcards", "qcm", "exercices"].forEach(function (mode) {
      var items = itemsDe(mode);
      var b = document.createElement("button");
      b.className = "mode" + (mode === modeActif ? " actif" : "");
      b.textContent = NOMS_MODES[mode] + " (" + items.length + ")";
      b.disabled = items.length === 0;
      b.addEventListener("click", function () {
        modeActif = mode; index = 0; reinitialiser(); construire();
      });
      m.appendChild(b);
    });
    if (itemsDe(modeActif).length === 0) {
      var premier = ["cours", "flashcards", "qcm", "exercices"].find(function (x) { return itemsDe(x).length; });
      if (premier) { modeActif = premier; construireModes(); }
    }
  }

  function section() { return chapitre.sections[sectionActive]; }
  function itemsDe(mode) { return (section() && section()[mode]) || []; }
  function reinitialiser() { verso = false; repondu = false; correctionVisible = false; }

  function cleItem(mode, item, i) {
    return section().id + "__" + mode + "__" + (item.id || i);
  }

  // ---------- rendu
  function rendre() {
    var items = itemsDe(modeActif);
    var zone = $("contenu");
    zone.innerHTML = "";
    if (!items.length) {
      zone.innerHTML = '<div class="carte"><p class="info">Rien dans cette partie pour le moment.</p></div>';
      return;
    }
    if (index >= items.length) return fin(zone, items.length);

    var item = items[index];
    var carte = document.createElement("div");
    carte.className = "carte";

    if (modeActif === "cours") rendreCours(carte, item);
    else if (modeActif === "flashcards") rendreFlash(carte, item);
    else if (modeActif === "qcm") rendreQcm(carte, item);
    else rendreExo(carte, item);

    zone.appendChild(carte);
    zone.appendChild(pied(items.length));
  }

  function rendreCours(carte, item) {
    var bloc = document.createElement("div");
    bloc.className = "bloc " + (item.type === "definition" ? "def"
                    : item.type === "exemple" ? "exemple"
                    : item.type === "piege" ? "piege"
                    : item.type === "formule" ? "formule" : "");
    if (item.titre) {
      var t = document.createElement("div");
      t.className = "bloc-titre"; t.textContent = item.titre;
      bloc.appendChild(t);
    }
    var p = document.createElement("p");
    p.textContent = item.texte || "";
    bloc.appendChild(p);
    carte.appendChild(bloc);
  }

  function rendreFlash(carte, item) {
    carte.classList.add("flash");
    var recto = document.createElement("div");
    recto.className = "flash-recto"; recto.textContent = item.recto;
    carte.appendChild(recto);
    if (verso) {
      var v = document.createElement("div");
      v.className = "flash-verso"; v.textContent = item.verso;
      carte.appendChild(v);
    } else {
      var ind = document.createElement("div");
      ind.className = "flash-indice"; ind.textContent = "Clique pour retourner";
      carte.appendChild(ind);
    }
    carte.addEventListener("click", function () {
      verso = !verso;
      if (verso) marquer(cleItem("flashcards", item, index), "flashcards");
      rendre();
    });
  }

  function rendreQcm(carte, item) {
    var q = document.createElement("div");
    q.className = "question"; q.textContent = item.question;
    carte.appendChild(q);

    var liste = document.createElement("div");
    liste.className = "reponses";
    item.options.forEach(function (texte, i) {
      var b = document.createElement("button");
      b.className = "reponse"; b.textContent = texte;
      b.disabled = repondu;
      if (repondu) {
        if (i === item.bonne) b.classList.add("juste");
        else if (i === repondu.choix) b.classList.add("faux");
      }
      b.addEventListener("click", function () {
        repondu = { choix: i, juste: i === item.bonne };
        if (repondu.juste) marquer(cleItem("qcm", item, index), "qcm");
        rendre();
      });
      liste.appendChild(b);
    });
    carte.appendChild(liste);

    if (repondu) {
      var e = document.createElement("div");
      e.className = "explication";
      e.textContent = (repondu.juste ? "Juste. " : "Faux. ") + (item.explication || "");
      carte.appendChild(e);

      var s = document.createElement("button");
      s.className = "signal";
      s.textContent = "Cette question est fausse";
      s.addEventListener("click", function () {
        s.textContent = "Signalé, merci. Trois signalements mettent la question en pause.";
        s.disabled = true;
        console.log("[Revyzia] signalement", chapitre.id, item.id);
      });
      carte.appendChild(s);
    }
  }

  function rendreExo(carte, item) {
    var e = document.createElement("div");
    e.className = "exo-enonce"; e.textContent = item.enonce;
    carte.appendChild(e);

    var b = document.createElement("button");
    b.className = "btn sobre";
    b.textContent = correctionVisible ? "Masquer la correction" : "Voir la correction";
    carte.appendChild(b);

    var c = document.createElement("div");
    c.className = "correction" + (correctionVisible ? " visible" : "");
    c.textContent = item.correction || "";
    carte.appendChild(c);

    b.addEventListener("click", function () {
      correctionVisible = !correctionVisible;
      if (correctionVisible) marquer(cleItem("exercices", item, index), "exercices");
      rendre();
    });
  }

  function pied(total) {
    var p = document.createElement("div");
    p.className = "pied";

    var gauche = document.createElement("span");
    gauche.className = "progression";
    gauche.textContent = (index + 1) + " sur " + total;
    p.appendChild(gauche);

    var boutons = document.createElement("div");
    boutons.style.display = "flex";
    boutons.style.gap = "8px";

    var prec = document.createElement("button");
    prec.className = "btn sobre"; prec.textContent = "Précédent";
    prec.disabled = index === 0;
    prec.addEventListener("click", function () { index--; reinitialiser(); rendre(); });
    boutons.appendChild(prec);

    var suiv = document.createElement("button");
    suiv.className = "btn";
    suiv.textContent = index === total - 1 ? "Terminer" : "Suivant";
    suiv.addEventListener("click", function () {
      var items = itemsDe(modeActif);
      if (modeActif === "cours") marquer(cleItem("cours", items[index], index), "cours");
      index++; reinitialiser(); rendre(); majCompteurs();
    });
    boutons.appendChild(suiv);

    p.appendChild(boutons);
    return p;
  }

  function fin(zone, total) {
    var c = document.createElement("div");
    c.className = "carte";
    var h = document.createElement("div");
    h.className = "question";
    h.textContent = "Partie terminée";
    c.appendChild(h);
    var p = document.createElement("p");
    p.className = "info";
    p.textContent = total + " éléments passés. Change de mode ou de partie en haut de page.";
    c.appendChild(p);

    var b = document.createElement("button");
    b.className = "btn";
    b.style.marginTop = "14px";
    b.textContent = "Recommencer";
    b.addEventListener("click", function () { index = 0; reinitialiser(); rendre(); });
    c.appendChild(b);

    zone.appendChild(c);
    majCompteurs();
  }

  // ---------- progression
  function marquer(cle, mode) {
    if (faits[cle]) return;
    faits[cle] = XP_PAR_MODE[mode] || 0;
    majCompteurs();
    enregistrer();
  }

  var enEcriture = null;
  function enregistrer() {
    if (!utilisateur || !refProgression) return;
    clearTimeout(enEcriture);
    enEcriture = setTimeout(function () {
      var total = nombreTotalItems();
      refProgression.set({
        chapitre: chapitre.id,
        matiere: chapitre.matiere,
        itemsFaits: faits,
        xpGagne: totalXp(),
        avancement: total ? Math.round(Object.keys(faits).length / total * 100) : 0,
        maj: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true }).then(function () {
        console.log("[Revyzia] progression enregistree", totalXp(), "XP");
      }).catch(function (e) {
        console.error("[Revyzia] echec enregistrement progression", e);
      });
    }, 800);
  }

  function totalXp() {
    var t = 0;
    for (var k in faits) if (faits.hasOwnProperty(k)) t += faits[k] || 0;
    return t;
  }

  function nombreTotalItems() {
    var n = 0;
    chapitre.sections.forEach(function (s) {
      ["cours", "flashcards", "qcm", "exercices"].forEach(function (m) {
        n += ((s[m]) || []).length;
      });
    });
    return n;
  }

  function majCompteurs() {
    $("xpChapitre").textContent = totalXp() + " XP";
    var total = nombreTotalItems();
    var faitsN = Object.keys(faits).length;
    $("avancement").textContent = total ? Math.round(faitsN / total * 100) + " %" : "0 %";
  }
})();
</script>
</body>
</html>
